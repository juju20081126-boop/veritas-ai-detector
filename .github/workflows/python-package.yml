name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pytest scripts/tests (Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scikit-learn
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pytest
        run: |
          pytest scripts/tests -q

  ruff-lint:
    name: Ruff Lint (Non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check scripts backend

  validate-notebooks:
    name: Validate Notebooks (Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nbformat
        run: |
          python -m pip install --upgrade pip
          pip install nbformat
      - name: Validate all notebooks
        run: |
          python -c "import glob, nbformat; [nbformat.validate(nbformat.read(f, as_version=4)) for f in sorted(glob.glob('notebooks/*.ipynb'))]; print('All notebooks valid JSON and schema v4')"

  check-markdown-links:
    name: Check Markdown Links (Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check relative links in documentation
        run: |
          python -c "
          import os, re, sys
          files = [
              'README.md',
              'EVAL_REPORT.md',
              'RESEARCH_COMPENDIUM.md',
              'MATHEMATICAL_EQUATIONS.md',
              'QUILLBOT_REVERSE_ENGINEERING_PLAN.md',
              'ZEROGPT_REVERSE_ENGINEERING_PLAN.md',
              'notebooks/README.md',
              'samples/README.md'
          ]
          pattern = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
          errors = []
          for doc in files:
              if not os.path.exists(doc):
                  continue
              with open(doc, 'r', encoding='utf-8') as f:
                  content = f.read()
              dir_name = os.path.dirname(doc)
              for match in pattern.finditer(content):
                  text, url = match.groups()
                  url = url.strip()
                  if url.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = url.split('#')[0]
                  if target:
                      full = os.path.normpath(os.path.join(dir_name, target))
                      if not os.path.exists(full):
                          errors.append(f'{doc}: Broken link [{text}]({url}) -> {full}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All documentation links valid!')
          "
